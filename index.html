<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Idle Game</h1>
    <div id="stats">
      <p>Coins: <span id="coins">0</span></p>
      <p>Per second: <span id="per-second">1</span></p>
    </div>
    <div id="actions">
      <button id="click-btn">Click (+1 coin)</button>
      <button id="upgrade-btn">Upgrade (cost: <span id="upgrade-cost">10</span>)</button>
    </div>
    <div id="log"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
