<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Idle Game</h1>

    <!-- Achievements toggle button (top right) -->
    <div id="achievements-bar">
      <button id="btn-achievements">🏆 成就</button>
    </div>

    <!-- Achievements Panel (modal overlay) -->
    <div id="achievements-panel" class="hidden">
      <div id="achievements-panel-inner">
        <div id="achievements-panel-header">
          <span>🏆 成就系统</span>
          <button id="achievements-close">✕</button>
        </div>
        <div id="achievements-summary"></div>
        <div id="achievements-list"></div>
      </div>
    </div>
    
    <!-- Resources Display -->
    <div id="stats">
      <div class="resource">
        <span class="resource-icon">🪙</span>
        <span class="resource-name">Gold:</span>
        <span id="gold">0</span>
        <span class="per-sec">(<span id="gold-per-second">1</span>/s)</span>
      </div>
      <div class="resource">
        <span class="resource-icon">💎</span>
        <span class="resource-name">Diamonds:</span>
        <span id="diamonds">0</span>
        <span class="per-sec">(<span id="diamonds-per-second">0</span>/s)</span>
      </div>
      <div class="resource">
        <span class="resource-icon">🪵</span>
        <span class="resource-name">Wood:</span>
        <span id="wood">0</span>
        <span class="per-sec">(<span id="wood-per-second">0</span>/s)</span>
      </div>
    </div>

    <!-- Click Actions -->
    <div id="click-actions">
      <h3>Manual Collection</h3>
      <button id="click-gold">Mine Gold (+1)</button>
      <button id="click-diamonds">Mine Diamonds (+1)</button>
      <button id="click-wood">Chop Wood (+1)</button>
    </div>

    <!-- Upgrades -->
    <div id="upgrades">
      <h3>Upgrades</h3>
      <div class="upgrade-row">
        <button id="upgrade-gold">
          Upgrade Gold Mine<br>
          <small>Cost: <span id="gold-upgrade-cost">10</span> gold</small>
        </button>
        <button id="upgrade-diamonds">
          Upgrade Diamond Mine<br>
          <small>Cost: <span id="diamonds-upgrade-cost">50</span> gold</small>
        </button>
        <button id="upgrade-wood">
          Upgrade Lumber Mill<br>
          <small>Cost: <span id="wood-upgrade-cost">30</span> gold</small>
        </button>
      </div>
    </div>

    <!-- Buildings -->
    <div id="buildings-section">
      <h3>Buildings</h3>
      <div class="building-row">
        <button id="build-mine">
          ⛏️ Build Gold Mine<br>
          <small>Cost: <span id="mine-cost">50</span> gold | Owned: <span id="mine-count">0</span> | +2 gold/s each</small>
        </button>
        <button id="build-farm">
          🌾 Build Farm<br>
          <small>Cost: <span id="farm-cost">200</span> gold | Owned: <span id="farm-count">0</span> | +5 gold/s each</small>
        </button>
        <button id="build-factory">
          🏭 Build Factory<br>
          <small>Cost: <span id="factory-cost">1000</span> gold | Owned: <span id="factory-count">0</span> | +20 gold/s each</small>
        </button>
      </div>
    </div>

    <!-- Auto-clicker -->
    <div id="auto-clicker-section">
      <h3>Automation</h3>
      <button id="buy-auto-clicker">
        🤖 Buy Auto-Clicker<br>
        <small>Cost: 100 gold (+1 click/s)</small>
      </button>
      <div id="auto-clicker-status"></div>
    </div>

    <!-- Conversion -->
    <div id="conversion">
      <h3>Resource Conversion</h3>
      <button id="convert-diamond">
        100 Gold → 1 Diamond
      </button>
      <button id="convert-wood">
        50 Gold → 5 Wood
      </button>
    </div>

    <!-- Cheat Codes / Special Events -->
    <div id="cheats-section">
      <h3>⚡ Special Events</h3>
      <div class="cheats-row">
        <!-- Windfall button: gives a large gold bonus, has a cooldown -->
        <button id="btn-windfall">
          💰 Show Me The Money<br>
          <small id="windfall-status">Gives 100× gold/s bonus!</small>
        </button>
        <!-- Free Upgrades button: 60s buff making all upgrades 90% cheaper -->
        <button id="btn-free-upgrades">
          🎁 Something For Nothing<br>
          <small id="free-upgrades-status">All upgrades 90% off for 60s!</small>
        </button>
      </div>
    </div>

    <div id="log"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
